services:
  db:
    image: postgres:16-alpine
    container_name: api-security-postgres
    environment:
      POSTGRES_DB: api_security
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d api_security"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: api-security-dashboard
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/api_security
      DB_USERNAME: api_user
      DB_PASSWORD: api_password
    ports:
      - "8080:8080"

volumes:
  postgres_data:
